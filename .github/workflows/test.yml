name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: golang:1.25.0
    steps:
      - uses: actions/checkout@v4
      - name: Go test
        run: go test -v ./...

      - name: Install doctest (this checkout)
        # Use the tree under test so CI proves the cross-device rename fix; @latest may lag.
        # -buildvcs=false: shallow Actions checkout often cannot stamp VCS metadata.
        run: go install -buildvcs=false ./cmd/doctest
      - name: Doctest
        run: doctest test -v ./...
