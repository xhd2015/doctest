name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go test
        run: go test -v ./...

      - name: Install doctest (this checkout)
        # Use the tree under test so CI proves the cross-device rename fix; @latest may lag.
        # Run on the Ubuntu VM (not a golang container) so default VCS stamping works
        # without -buildvcs=false.
        run: go install ./cmd/doctest
      - name: Doctest
        # Full labeled suite is multi-run nested selftests (leaf-cache, go-test-cache).
        # go test default 10m kills the workspace binary mid-run (~900 leaves).
        # Quiet mode: case set is the same as -v after prepare-parity; use -v only when debugging.
        run: doctest test --label-all ./... -timeout=30m
