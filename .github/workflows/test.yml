name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: golang:1.25.0
    steps:
      - uses: actions/checkout@v4
      - name: Fix safe.directory
        run: git config --global --add safe.directory /__w/doctest/doctest
      - name: Debug env
        run: |
          echo "=== go version ===" && go version
          echo "=== go env ===" && go env GOFLAGS GOVCS GOVERSION GOROOT
          echo "=== git version ===" && git version
          echo "=== git config safe.directory ===" && git config --global --get-all safe.directory || true
          echo "=== pwd ===" && pwd
          echo "=== is inside work tree ===" && git rev-parse --is-inside-work-tree
          echo "=== temp dir build test ===" && tmpdir=$(mktemp -d) && cd "$tmpdir" && echo 'package main; func main() {}' > main.go && go mod init testcase && go build . 2>&1; echo "build exit: $?"
      - name: Go test
        run: go test -v ./...

      - name: Install doctest
        run: |
          if ! command -v doctest >/dev/null 2>&1; then
            go install github.com/xhd2015/doctest/cmd/doctest@latest
          fi
      - name: Doctest
        run: doctest test -v ./...
