name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go test
        run: go test -v ./...

      - name: Install doctest (this checkout)
        # Use the tree under test so CI proves the cross-device rename fix; @latest may lag.
        # Run on the Ubuntu VM (not a golang container) so default VCS stamping works
        # without -buildvcs=false.
        run: go install ./cmd/doctest
      # Layer model (DOCTEST_DESIGN_PRINCIPLE): discovery = in-process mass;
      # label e2e = full integration only. Prefer discovery for PR signal; e2e on full push.
      - name: Doctest discovery (in-process mass)
        # Unlabeled leaves only — skips label:e2e / heavy. Fast PR feedback.
        run: doctest test ./... -timeout=30m
      - name: Doctest e2e (full integration)
        # True process-boundary / nested-product leaves (label: e2e).
        # Multi-run nested selftests can be multi-minute; allow full timeout.
        run: doctest test --label e2e ./... -timeout=30m
