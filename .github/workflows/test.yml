name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: golang:1.25.0
    steps:
      - uses: actions/checkout@v4
      - name: Go test
        run: go test -v ./...

      - name: Build doctest
        run: |
          BUILDFLAGS=""
          if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            BUILDFLAGS="-buildvcs=false"
          fi
          go build $BUILDFLAGS -o doctest ./cmd/doctest
      - name: Doctest
        run: ./doctest test -v ./...
